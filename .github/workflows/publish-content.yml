# Publishes /content (weekly activity packs, manifest, privacy & terms pages) to GitHub Pages.
# The app reads https://<owner>.github.io/<repo>/manifest.json, so merging a new week to main
# delivers it to every installed app without a store update.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Publish weekly content

on:
  push:
    branches: [main]
    paths: ['content/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx jest __tests__/content.test.ts --ci

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: content
      - id: deployment
        uses: actions/deploy-pages@v4
